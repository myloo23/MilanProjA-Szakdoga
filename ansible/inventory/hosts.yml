---
# One group, one host. "The host" means the machine whose Docker daemon we
# deploy to — today this laptop, over a local connection.
#
# Ansible is orchestrating Docker here, not configuring a remote OS, so a local
# connection is the correct shape for this task rather than a shortcut. Moving
# to a real second host later is an edit to this file plus group_vars, and no
# change at all to the role:
#
#   docker-host:
#     ansible_host: 192.168.64.10
#     ansible_user: ubuntu
#     ansible_connection: ssh
#
all:
  children:
    local_docker:
      hosts:
        docker-host:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
