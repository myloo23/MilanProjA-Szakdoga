# Ansible only reads ansible.cfg from the current working directory (or from
# ANSIBLE_CONFIG). Run every ansible command from this directory: cd ansible/
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = false
display_skipped_hosts = false
stdout_callback = default

[diff]
# Always show what a task would change. In --check mode this is the dry run.
always = true
context = 3
