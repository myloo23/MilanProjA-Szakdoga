#cloud-config
# A gép első indulásakor fut le, egyszer. Ez egy Terraform-sablon: a dollárjeles
# behelyettesítési helyeket a templatefile() tölti ki, tehát a fájl önmagában,
# Terraform nélkül nem futtatható. (Kommentben sem írhatunk ilyen helyőrzőt,
# mert a sablonfeldolgozó azt is kifejezésként próbálná értelmezni.)

package_update: true
package_upgrade: false

packages:
  # A Gitea, az act_runner és a registry ezen a Docker-motoron fog futni
  # (platform/compose.yaml). A k3s ettől függetlenül a saját containerd-jét
  # használja — a kettő egymás mellett fut, nem egymáson.
  - docker.io
  - docker-compose-v2
  - curl

# A k3s registry-beállítása szándékosan NINCS itt, és ez mérési eredmény, nem
# feledékenység.
#
# Korábban ez a fájl kiírt egy /etc/rancher/k3s/registries.yaml-t, amely a
# localhost:5001 címet sima HTTP-s tükörként hirdette meg. A 2.4 pont
# ellenőrzésekor kiderült, hogy nem csinál semmit: k3s v1.36.4 alatt a fájlból
# egyetlen sor sem került a generált containerd-konfigurációba (a
# /var/lib/rancher/k3s/agent/etc/ fában sehol nem szerepelt az 5001-es port),
# a fürt mégis lehúzta a képet a gépen futó registryből. A fájl átnevezése és
# a k3s újraindítása után is lehúzta — ez a negatív próba, és ez dönti el.
# Bizonyíték: szakdolgozat/bizonyitek/03-platform-koltoztetes.md.
#
# A magyarázat a containerd alapértelmezése: a loopback-címre mutató registryt
# (localhost, adott porton) kivételként kezeli, és TLS nélkül is elfogadja. A
# fürt tehát nem attól éri el a registryt, hogy itt beállítanánk, hanem attól,
# hogy ugyanazon a gépen fut — vagyis a D5 döntés következménye, nem külön
# konfigurációé.
#
# Mikor kell mégis vissza: ha a képhivatkozás valaha nem localhost-előtagú lesz
# (a gép nevére vagy privát IP-címére vált), a kivétel nem érvényes. Akkor
# viszont nem elég visszatenni a fájlt, hanem ellenőrizni is kell, hogy az adott
# k3s-verzió tényleg átvezeti-e a containerdbe — mert ez a verzió nem tette.

runcmd:
  - [ systemctl, enable, --now, docker ]
  - [ usermod, -aG, docker, "${admin_username}" ]

  # k3s telepítése.
  #   --tls-san <publikus IP>: a fürt API-tanúsítványa erre a címre is
  #     érvényes legyen, különben a laptopodról a kubectl tanúsítványhibát kap.
  #   --write-kubeconfig-mode 0644: a kubeconfig olvasható legyen sudo nélkül,
  #     hogy egy scp-vel le tudd hozni. Egyfelhasználós mérőgépen vállalható;
  #     megosztott gépen nem lenne az, és ezt a dolgozatban ki kell mondani.
  - |
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_EXEC="--tls-san ${public_ip} --write-kubeconfig-mode 0644" sh -

  # Jelzőfájl: erről tudja a Terraform-kimenet ellenőrzése és te is, hogy a
  # cloud-init végigfutott, nem csak a gép indult el.
  - [ touch, /var/lib/cloud/instance/k3s-ready ]
