name: Pipeline

# One workflow, two jobs, one directed graph: build-test-push produces the
# artifact, deploy consumes it. They are separate jobs — separate containers,
# no shared state — but not separate workflows, because the runner has
# capacity 1 and two independently triggered workflows can be scheduled in
# either order. CD would then wait for an image CI has not pushed yet while CI
# waits for the runner to free up. `needs:` makes the ordering a fact instead
# of a hope.
on:
  # Push-only, deliberately, and this is a reversal worth understanding.
  #
  # Review now happens on GitHub; Gitea is the execution environment. No pull
  # request will ever be opened here again, so a `pull_request:` trigger would
  # be a rule that can never fire — and every feature branch would silently get
  # no CI at all. A pipeline that does not run looks exactly like a pipeline
  # that has nothing to complain about.
  #
  # That also retires the reason push was once narrowed to main: the duplicate
  # run it avoided came from push and pull_request both firing, and one half of
  # that pair no longer exists.
  #
  # The branch list mirrors the naming convention in docs/BRANCHING.md. Anything
  # outside it — a scratch branch, an experiment — gets no runner, which on a
  # runner with capacity 1 is the difference between a queue and a wait.
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
      - 'hotfix/**'

# Every step that touches the network, the Docker daemon or a container is
# bounded by `timeout-minutes`. This runner has `capacity: 1`
# (platform/config.yaml), so an unbounded step that hangs is not a slow build —
# it is the whole pipeline stopped until a human notices, and `runner.timeout`
# is 3h, which is the difference between an outage and a morning.
#
# Deliberately per step, not one number on the job. A blanket bound tells you
# the run hung; a per-step bound tells you *which* step and, from the value,
# what it was expected to cost. The numbers below are hang detectors, not
# budgets — each is roughly an order of magnitude above what the step actually
# takes, so a bound firing means something is wrong rather than slow. Where the
# number is not obvious from the step name, the reasoning is on the step.
#
# Steps doing pure local work and no I/O are left unbounded on purpose: the ref
# gate is four lines of shell that cannot block, and giving it a timeout would
# suggest it could.
#
# Job-level `timeout-minutes` is deliberately absent. The spike never exercised
# it — the step bound fired first, every time — so adding it would be an
# untested construct guarding a tested one. Per §6, an unproven claim is worse
# than a missing one.
jobs:
  build-test-push:
    runs-on: ubuntu-latest

    # Published downstream so the deploy job can reuse this decision instead of
    # re-deriving it. One definition of "this ref ships", two consumers.
    outputs:
      ships: ${{ steps.ref_gate.outputs.ships }}
      # The tag every downstream consumer uses. Published from the same step as
      # `ships` for the same reason: one definition, several consumers.
      sha_short: ${{ steps.ref_gate.outputs.sha_short }}

    steps:
      - name: Mark the start of the run
        # The measurement's machine-readable clock. Gitea timestamps every step
        # anyway, but those live in the web UI and have to be read by hand; a
        # line in the log can be grepped out of a saved run and pasted into the
        # CSV. Same reasoning as the timestamped prompt on the manual side: a
        # measurement that depends on someone reading a clock is not a
        # measurement.
        run: echo "MERES pipeline-start $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Decide whether this ref ships an artifact
        id: ref_gate
        # `main` and `release/*` are protected on GitHub and reach this runner
        # only after review, so they are the refs allowed to publish an image
        # and deploy it. Feature and hotfix branches build, test and scan —
        # they prove the change is sound without putting anything in the
        # registry, which holds deployable artifacts only.
        #
        # Written as a shell `case` rather than an `if:` expression, and the
        # reason has changed. It used to say startsWith() was not something to
        # bet a release gate on under act_runner. The Sprint 3 spike tested that
        # claim and it was wrong: startsWith(), contains(), success() and
        # always() all evaluate correctly on v0.2.12 (ADR-0005).
        #
        # The code stays as it is, because the reason it is *correct* was never
        # the expression-support one. This gate has to publish a value two
        # consumers read, and it has to do it without interpolating a branch
        # name into a shell. `case` does both in four POSIX lines. That argument
        # survives the spike; the old one did not, so it is replaced rather than
        # quietly left standing.
        #
        # The ref arrives through the environment, never interpolated straight
        # into the script. `${{ }}` is substituted as raw text before the shell
        # ever sees it, so a branch named with shell metacharacters would run as
        # code here. Branch names come from whoever can push — treat them as
        # input, not as trusted values.
        #
        # This step also publishes the image tag, which is the **short** SHA
        # and not `github.sha`. The measurement is why. The manual series tags
        # with `git rev-parse --short HEAD` and checks acceptance by comparing
        # /version against that string; a pipeline tagging with the full 40
        # characters would put two tag shapes in the registry for the same
        # artifact and two spellings of the same version in the acceptance
        # check. Derived once, here, so the image tag, the GIT_SHA build
        # argument, the Helm value and the assertion cannot disagree.
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          case "$REF" in
            refs/heads/main|refs/heads/release/*) ships=true ;;
            *)                                    ships=false ;;
          esac
          sha_short=$(printf '%s' "$SHA" | cut -c1-7)
          echo "ships=$ships" >> "$GITHUB_OUTPUT"
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"
          echo "$REF -> ships=$ships, tag=$sha_short"

      - name: Set up Python
        timeout-minutes: 5
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.txt
      
      - name: Run Ruff
        timeout-minutes: 2
        run: ruff check .

      - name: Scan the working tree for secrets
        # Closes F6 from docs/security-review-2026-08-10.md. The pre-commit
        # gitleaks hook lands the same check on the author's machine seconds
        # after the mistake, but it is client-side and `--no-verify` skips it.
        # Non-negotiable #4 says a check that cannot fail the build is a log
        # line, so the hook is the convenience and this step is the gate.
        #
        # Placed here, immediately after Ruff, on the pipeline's fail-fast cost
        # order: it needs no build and no image, and a leaked credential is the
        # one finding whose cost keeps growing while the rest of the pipeline
        # runs.
        #
        # Trivy rather than gitleaks-in-CI so the pipeline has one scanner
        # rather than two, already pinned at the version docs/sbom/README.md
        # records. `fs` scans the checkout; the `image` step later scans what
        # was built from it.
        #
        # `--scanners secret` only, deliberately. The review also recommends
        # `misconfig`, which reads the compose file and the Dockerfile and is
        # expected to come back red on first run. That triage is real work and
        # it is not secret scanning, so it is tracked separately in PLAN.md
        # rather than bundled in here and half-done.
        #
        # No bind mount, and that is the whole reason this step looks odd.
        # `-v "$PWD:/src"` fails here: the job runs in a container, the Docker
        # socket is the *host* daemon's, so the daemon resolves $PWD against the
        # host filesystem where /workspace/... does not exist. On Docker Desktop
        # it surfaces as "mounts denied: path is not shared from the host",
        # which reads like a Docker Desktop preference and is not one — sharing
        # that path would not help, because the path is not the host's.
        #
        # Same family as the smoke-test `localhost` bug, and the other two
        # container steps already dodge it: hadolint takes the Dockerfile on
        # stdin, and the Trivy image scan mounts only the socket. This one ships
        # the tree in instead of mounting it.
        #
        # `git archive HEAD` rather than `docker cp .`: it emits exactly the
        # tracked tree at the commit under test, so .git and any untracked local
        # clutter stay out without an exclude list to keep in sync.
        #
        # The file count is not decoration. Trivy exits 0 both when it finds no
        # secrets and when it is handed an empty directory, and the first draft
        # of this step piped `git archive` straight into `docker cp` — where a
        # failed archive is masked by the exit status of the last command in the
        # pipeline and the scan quietly succeeds over nothing. Same failure mode
        # the hadolint step guards with `test -s Dockerfile`, and the same fix:
        # assert there is input, and print what was scanned so a green log says
        # something rather than merely saying nothing.
        timeout-minutes: 5
        run: |
          git archive --format=tar --prefix=src/ HEAD > /tmp/tree.tar
          files=$(tar -tf /tmp/tree.tar | grep -cv '/$')
          test "$files" -gt 0 || { echo "git archive produced an empty tree"; exit 1; }
          echo "trivy 0.72.0: scanning $files tracked files for secrets"

          cid=$(docker create aquasec/trivy:0.72.0 fs \
            --exit-code 1 \
            --scanners secret \
            /src)
          docker cp - "$cid:/" < /tmp/tree.tar
          rc=0
          docker start --attach "$cid" || rc=$?
          docker rm --force "$cid" >/dev/null 2>&1 || true
          exit $rc

      - name: Lint the Dockerfile
        timeout-minutes: 3
        # A step inside this job rather than a job of its own. A separate job
        # would be the textbook answer, but this runner has capacity 1: two
        # jobs would not run in parallel, they would queue, paying a second
        # container start-up for a lint that takes under a second.
        #
        # Pinned, not :latest. The whole pipeline rests on the claim that an
        # artifact is reproducible; a gate that silently changes its own rules
        # between runs undermines that, and a linter that gains a rule
        # overnight fails a build nobody touched.
        #
        # The threshold is stated explicitly even though `info` is currently
        # hadolint's default, so the strictness is a decision in this file
        # rather than an upstream default we inherited without noticing.
        #
        # The binary is named explicitly. This image declares CMD but no
        # ENTRYPOINT, so any argument passed here replaces the command
        # outright instead of appending to it — leaving Docker to execute
        # `--failure-threshold` as though it were a program.
        #
        # hadolint prints nothing when it finds nothing, so a clean run and a
        # run that received an empty stdin look identical from the log. The
        # guard makes the difference explicit: a gate that cannot fail is not
        # a gate, and the failure mode here is silence, not an error.
        run: |
          test -s Dockerfile || { echo "Dockerfile is missing or empty"; exit 1; }
          docker run --rm -i hadolint/hadolint:v2.14.0 \
            /bin/hadolint --failure-threshold info - < Dockerfile
          echo "hadolint v2.14.0: no findings at or above info"

      - name: Run tests with coverage
        timeout-minutes: 5
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Install the Ansible control node and collections
        timeout-minutes: 6
        # Needed only by the lint step below, and installed as its own step so a
        # dependency-resolution failure reads as one instead of hiding inside a
        # lint failure.
        #
        # requirements-lint.txt pulls in requirements-ansible.txt, so CI lints
        # against the same ansible-core the deploy job runs. Two pins would
        # eventually disagree, and the version that lints would stop being the
        # version that deploys.
        #
        # The collection is not optional. ansible-lint's syntax-check resolves
        # every module it sees, and without community.docker installed the role
        # fails with unknown-module on tasks that are perfectly correct. A gate
        # that fails for a reason unrelated to the code is worse than no gate:
        # it teaches you to skim past red.
        run: |
          python -m pip install --require-hashes -r ansible/requirements-lint.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Lint the Ansible playbooks and role
        timeout-minutes: 3
        working-directory: ansible
        # Placed here, after the checks that need no installation and before the
        # build, to keep the job in cost order. ruff, hadolint and pytest all
        # run against dependencies this job already has; this is the first gate
        # that pays for a download, so it goes after them — and still ahead of
        # build, scan and push, because a playbook that cannot lint is a
        # playbook that cannot deploy the image those stages produce.
        #
        # A step rather than a job, for the reason hadolint is: the runner has
        # capacity 1, so a second job would queue rather than parallelise and
        # bill another container start-up for a lint that takes seconds.
        #
        # Not in the deploy job either, which is the more tempting mistake —
        # Ansible is already installed there. But deploy runs only on refs that
        # ship, so every feature branch would go unlinted, and feature branches
        # are exactly where playbook mistakes are made.
        #
        # The strictness lives in ansible/.ansible-lint, not in a flag here, so
        # `ansible-lint` on a laptop and `ansible-lint` in CI cannot disagree
        # about what passing means.
        run: |
          ansible-lint --version
          ansible-lint .

      - name: Build Docker image
        # The one step that legitimately costs minutes on a cold layer cache:
        # the builder stage runs a hash-checked pip install of the whole runtime
        # lock. Ten minutes is generous against an observed ~90s warm, which is
        # the point — a bound that fires on a slow day trains you to raise it.
        timeout-minutes: 10
        # GIT_SHA is not decoration: the Dockerfile turns it into APP_VERSION,
        # which is what /version reports, which is what the deploy's acceptance
        # check compares against. Without it the image defaults to "dev" and
        # the automated side cannot satisfy the criterion the manual side does.
        # It sits after the dependency install in the Dockerfile, so a value
        # that changes every commit invalidates no expensive layer.
        run: |
          docker build \
            --build-arg GIT_SHA=${{ steps.ref_gate.outputs.sha_short }} \
            --tag localhost:5001/projecta-flask:${{ steps.ref_gate.outputs.sha_short }} \
            .

      - name: Build the frontend image
        # The chart deploys two images from one commit under one tag
        # (chart/values.yaml), so a pipeline that builds only the backend
        # publishes half a release: `helm upgrade --set image.tag` would point
        # the frontend Deployment at a tag that was never pushed, and the
        # rollout would sit in ImagePullBackOff until the wait timed out.
        #
        # Neither linted nor scanned, unlike the backend image, and that is a
        # deliberate omission rather than an oversight: hadolint and Trivy on a
        # Dockerfile that has never been through either are new gates, and a
        # new gate introduced days before a measurement series can go red on a
        # base-image advisory that has nothing to do with the change under
        # test. That burns measurement runs. Tracked for the hardening pass —
        # the argument goes in the same commit as the gate, per ADR-0005.
        timeout-minutes: 10
        run: |
          docker build \
            --tag localhost:5001/projecta-frontend:${{ steps.ref_gate.outputs.sha_short }} \
            frontend/

      - name: Run container
        timeout-minutes: 2
        run: |
          docker run -d \
            --name flask-test \
            --network projecta-platform \
            localhost:5001/projecta-flask:${{ steps.ref_gate.outputs.sha_short }}

      - name: Wait for the container to report healthy
        # The loop already bounds itself at 30 iterations. This is not that
        # bound restated — it guards `docker inspect` itself hanging against a
        # wedged daemon, which the loop cannot detect because it never returns
        # to run the next iteration.
        timeout-minutes: 2
        # The image already declares what "healthy" means, in the Dockerfile's
        # HEALTHCHECK. This reads that verdict rather than re-implementing the
        # probe, so CI and the image cannot drift apart the way a hand-rolled
        # curl loop eventually would.
        #
        # It replaces `sleep 5`, which was a bet that the app starts in under
        # five seconds — silently fine on a warm runner, a flake on a cold one,
        # and in neither case a statement about the application.
        #
        # Bounded at 30s so a hung app fails this step with evidence instead of
        # hanging until the runner's own timeout kills the job. The loop exits
        # early if the container stops: once it is not running, waiting longer
        # cannot change the answer.
        run: |
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Status}}:{{.State.Health.Status}}' flask-test)
            case "$state" in
              running:healthy) echo "container healthy ($state)"; exit 0 ;;
              running:*)       sleep 1 ;;
              *)               echo "container stopped while starting ($state)"; break ;;
            esac
          done
          echo "container never reported healthy (last state: ${state:-unknown})"
          docker inspect -f '{{json .State.Health}}' flask-test
          docker logs flask-test
          exit 1

      - name: Verify the application answers over the network
        # curl is called without --max-time, so on a black-holed connection it
        # waits forever. This is the only thing that bounds it.
        timeout-minutes: 2
        # Kept, and no longer a race: the step above has already established the
        # app is up, so a failure here means something narrower and more useful
        # — the app is healthy from the inside but unreachable from another
        # container on projecta-platform. The HEALTHCHECK probes localhost from
        # within the container and can never catch that.
        run: |
          curl --fail --show-error --silent http://flask-test:8000/health

      - name: Scan image with Trivy
        # The likeliest step in this file to hang, and not because of the scan:
        # Trivy downloads its vulnerability database on a cache miss, from a
        # registry this project does not control. Ten minutes covers a slow
        # fetch; anything past that is not slow, it is stuck.
        timeout-minutes: 10
        # Pinned like hadolint and ansible-lint, and for the same reason: a
        # scanner on `latest` can gain a rule or a database entry overnight and
        # fail a build nobody touched. That is a red pipeline you cannot
        # attribute to a change, which is the one kind of failure that teaches
        # people to ignore the gate.
        #
        # 0.72.0 is the version docs/sbom/README.md records for the inventory,
        # so the scanner that gates the build is the scanner that produced the
        # SBOM. Bump it deliberately, in its own commit, so a new finding is
        # attributable to the bump rather than to the day it happened.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0 image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            localhost:5001/projecta-flask:${{ steps.ref_gate.outputs.sha_short }}

      - name: Cleanup container
        timeout-minutes: 2
        if: always()
        run: |
          docker stop flask-test || true
          docker rm flask-test || true

      - name: Push Docker image
        timeout-minutes: 5
        # Only reviewed refs publish. A feature branch builds, tests and scans
        # its image, then throws it away — the registry holds deployable
        # artifacts only, and nothing is deployable before review.
        if: steps.ref_gate.outputs.ships == 'true'
        run: |
          docker push localhost:5001/projecta-flask:${{ steps.ref_gate.outputs.sha_short }}
          docker push localhost:5001/projecta-frontend:${{ steps.ref_gate.outputs.sha_short }}

      - name: Reclaim the build's disk
        timeout-minutes: 3
        # Every run builds an image tagged with its own SHA, so nothing ever
        # overwrites anything and the runner's disk only grows. On a host that
        # also carries Gitea, the registry and the deployed container, that ends
        # as a full disk during a demo rather than as a warning.
        #
        # Runs after the push, never before: for shipping refs the registry is
        # the copy that matters, and removing the local tag first would delete
        # the artifact this job exists to publish. For every other ref the image
        # was always disposable.
        #
        # `always()` so a failed scan or a failed push still cleans up, and
        # `|| true` so cleanup can never be the thing that fails the build.
        #
        # **`docker image prune --force` used to follow this line and has been
        # removed.** It takes no filter, so it deleted every dangling image on
        # the host — not the ones this run produced. On a single-owner laptop
        # that is invisible; on the TCS machine, which risk B1 leaves an open
        # question, it is CI throwing away somebody else's build cache. A step
        # that reaches outside the job to do it is worse than a step that
        # leaves a little disk behind. F9 in
        # docs/security-review-2026-08-10.md.
        #
        # The `docker rmi` above is what actually reclaimed the space: it drops
        # this run's tag and, with it, every layer no other image references.
        # The prune was only ever catching intermediate layers on top of that,
        # and it is not this job's business to decide they are nobody's.
        #
        # The honest cost: if the runner's disk does creep, nothing here now
        # stops it, and `docker builder prune` on the host is the answer — run
        # by a human who knows whose machine it is.
        if: always()
        run: |
          docker rmi localhost:5001/projecta-flask:${{ steps.ref_gate.outputs.sha_short }} || true
          docker rmi localhost:5001/projecta-frontend:${{ steps.ref_gate.outputs.sha_short }} || true

  deploy:
    # Runs only after the artifact exists, and only for refs that published one.
    # release/* deploys as well as main: release/meres is the branch the
    # automated measurement series is pushed to, and release/sprintN is the
    # branch that gets demonstrated.
    needs: build-test-push
    if: needs.build-test-push.outputs.ships == 'true'
    runs-on: ubuntu-latest

    # **This job deploys to the k3s cluster with Helm, not to the Docker host
    # with Ansible.** ADR-0009 made that decision on 2026-09-21 and this file
    # followed it here. The previous version of this job ran
    # `ansible-playbook playbooks/deploy.yml`, which reconciles a container on
    # the host's Docker daemon — a different target from the one the manual
    # measurement series deploys to. Left as it was, the two halves of the
    # measurement would have deployed to two different systems, and §6.4's
    # claim that the only difference between them is the branch name would
    # have been false.
    #
    # The Ansible deploy path is not deleted. It is the previous generation of
    # the chain and the thesis describes both; `playbooks/deploy.yml` still
    # works by hand.
    #
    # Literal values only in this block, no expressions. Step-level `env:` with
    # `${{ }}` is proven on this runner — the ref gate has used it in
    # production since the beginning — whereas job-level env with expressions
    # is not something ADR-0005 tested, and the helper script defaults to these
    # same values anyway, so nothing breaks if the runner ignores them.
    env:
      RELEASE: projecta
      HELM_IMAGE: alpine/helm:3.22.0
      KUBECONFIG_HOST_PATH: /etc/rancher/k3s/k3s.yaml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ansible/requirements-ansible.txt

      - name: Install Ansible
        timeout-minutes: 5
        # Still here, and the collection install that used to follow it is not.
        # Verification is `ansible.builtin.uri` and `ansible.builtin.assert` —
        # both built in — so this job needs ansible-core and nothing from
        # Galaxy. community.docker is only used by the deploy path this job no
        # longer takes, and by ansible-lint in the build job, which installs it
        # for itself.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r ansible/requirements-ansible.txt

      - name: Resolve the address of the Docker host
        # The verification below reaches the cluster's ingress on the host's
        # port 80. From this job container that is not localhost: the container
        # sits on the projecta-platform bridge, and the host is that bridge's
        # gateway.
        #
        # Asked of Docker rather than derived, and this is the third answer to
        # the same question. `ip -4 route show default` was the first and it
        # exits 127: the runner image has no iproute2. Parsing /proc/net/route
        # was the second, and it is only as reliable as the container having an
        # IPv4 default route in that file. The network's gateway is not a value
        # to infer from the container's own view at all — it is a property of
        # the network, and the daemon that owns the network will state it.
        #
        # The fallback stays, for a container whose network Docker cannot
        # describe. If both come back empty, the last resort is a fixed name:
        # add `--add-host=host.docker.internal:host-gateway` to
        # container.options in platform/config.yaml and restart the runner — no
        # re-registration needed.
        run: |
          set -eu
          addr=$(docker network inspect projecta-platform \
                   --format '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || true)
          if [ -z "$addr" ]; then
            addr=$(python -c "import socket,struct;r=[l.split() for l in open('/proc/net/route').readlines()[1:]];g=[x[2] for x in r if x[1]=='00000000'];print(socket.inet_ntoa(struct.pack('<L',int(g[0],16))) if g else '')" 2>/dev/null || true)
          fi
          test -n "$addr" || { echo "could not determine the Docker host address"; exit 1; }
          echo "DOCKER_HOST_ADDR=$addr" >> "$GITHUB_ENV"
          echo "Docker host reachable at $addr"

      - name: Record the release that is running now
        timeout-minutes: 3
        # Three things at once, and each of them earns the step.
        #
        # It is the skeleton check the Ansible ping play used to be: if helm
        # cannot read this release, the kubeconfig, the API server or the
        # release itself is wrong, and that is a different failure from a
        # deploy that went bad — a distinction which is expensive to make from
        # a half-finished deploy's logs.
        #
        # It records the tag to roll back *to*, so the rollback below can
        # assert that the cluster really did return to the previous version
        # instead of assuming it. Same idea as the Ansible role's "record what
        # is running now, so a failure can name its own rollback".
        #
        # `helm get values` returns only what was passed with --set, which is
        # exactly image.tag. An empty answer means the release was installed
        # without a tag, and deploying on top of that would leave nothing
        # identifiable to go back to.
        run: |
          set -eu
          prev=$(scripts/helm-on-host.sh get values "$RELEASE" --output json \
            | python -c 'import json,sys; print((json.load(sys.stdin) or {}).get("image", {}).get("tag", ""))')
          test -n "$prev" || {
            echo "release '$RELEASE' has no image.tag value — nothing to roll back to"
            exit 1
          }
          echo "PREV_TAG=$prev" >> "$GITHUB_ENV"
          echo "currently deployed: $prev"

      - name: Deploy the artifact this pipeline built
        # Bounded above helm's own --timeout, not below it: helm is allowed to
        # spend five minutes failing honestly, and this catches a step that
        # stops making progress at all — a registry pull that never returns, a
        # wedged daemon.
        timeout-minutes: 10
        env:
          TAG: ${{ needs.build-test-push.outputs.sha_short }}
        # No build here, deliberately: this deploys the images the job above
        # built, tested, scanned and pushed under this exact tag. Rebuilding
        # would ship a different artifact than the one that passed the gates.
        #
        # `--wait` is what replaces steps 10 and 11 of the manual protocol —
        # the two `kubectl rollout status` commands, one per Deployment. It is
        # the same kind of answer, a readiness signal rather than a timer, as
        # ADR-0003 requires; the difference is that the operator pays for one
        # command per component and the pipeline pays for one flag. That
        # difference is a finding for §6.4, not a shortcut.
        #
        # Not `--atomic`. Helm's own automatic rollback would fire on its own
        # verdict and leave nothing to measure: the failure this project cares
        # about is the one helm cannot see, where the pods come up healthy and
        # the application is still broken. The rollback stays an explicit,
        # separately timed step below.
        #
        # The marker file is written *before* the upgrade, not after. A helm
        # upgrade that fails part-way has already touched the release, so it is
        # exactly the case the rollback exists for.
        run: |
          set -eu
          touch /tmp/deploy-attempted
          echo "MERES deploy-start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          scripts/helm-on-host.sh upgrade --install "$RELEASE" /chart \
            --set image.tag="$TAG" \
            --wait --timeout 5m
          echo "MERES live $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify the deployed release
        timeout-minutes: 5
        env:
          TAG: ${{ needs.build-test-push.outputs.sha_short }}
        # The gate. Same checks as scripts/smoke.sh and the same ones the
        # operator reads by eye in step 13 of the manual protocol — but here
        # every one of them fails the play, and therefore the job. That
        # asymmetry is deliberate and it is a result: scripts/smoke.sh has no
        # `set -e` and its check() asserts nothing, so on the manual side the
        # verdict is a human reading output (step V1 of the recovery protocol).
        # Both sides check the same things; only one side decides mechanically.
        #
        # Through the ingress, so the frontend's nginx and Traefik are part of
        # what is verified — the same path the manual acceptance check takes.
        run: |
          set -eu
          cd ansible
          ansible-playbook playbooks/verify.yml \
            -e app_version="$TAG" \
            -e deploy_app_smoke_vantage=ingress \
            -e deploy_app_ingress_host="$DOCKER_HOST_ADDR" \
          || { echo "MERES detect $(date -u +%Y-%m-%dT%H:%M:%SZ)"; exit 1; }
          echo "MERES accepted $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Roll back to the previous revision
        if: failure()
        timeout-minutes: 10
        # The automated counterpart of V2–V6. `helm rollback` with no revision
        # goes to the previous one, which is the release this job recorded
        # before touching anything — so the target is an identifier, not
        # something reconstructed under pressure (ADR-0009).
        #
        # Verified, not assumed: the same acceptance check runs again against
        # the previous tag, so "rolled back" means the old version is answering
        # on the ingress, not merely that helm printed a success line.
        #
        # This step does not rescue the job. A successful rollback is not a
        # successful deploy: the job stays red, which is what stops a broken
        # commit from being mistaken for a shipped one.
        #
        # The guard exists because `failure()` fires for any earlier failure,
        # including a pip install that never got near the cluster. Rolling a
        # healthy release back because Galaxy was down would be the pipeline
        # causing the outage it is supposed to prevent. A marker file rather
        # than `steps.<id>.outcome`, which ADR-0005 has not tested on this
        # runner.
        run: |
          set -eu
          test -f /tmp/deploy-attempted || {
            echo "nothing was deployed in this run — no rollback to perform"
            exit 0
          }
          scripts/helm-on-host.sh rollback "$RELEASE" --wait --timeout 5m
          cd ansible
          ansible-playbook playbooks/verify.yml \
            -e app_version="$PREV_TAG" \
            -e deploy_app_smoke_vantage=ingress \
            -e deploy_app_ingress_host="$DOCKER_HOST_ADDR"
          echo "MERES restored $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Report what is now running
        env:
          TAG: ${{ needs.build-test-push.outputs.sha_short }}
        run: |
          echo "Deployed $TAG (previous revision was $PREV_TAG)"
          echo "Roll back by hand on the host with: helm rollback $RELEASE"
