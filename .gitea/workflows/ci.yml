name: CI Workflow

on:
  push:
  pull_request:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checked-out source
        run: |
          pwd
          ls -la
          git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Verify Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.txt
      
      - name: Run Ruff
        run: ruff check .

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Build Docker image
        run: |
          docker build \
            --tag localhost:5001/projecta-flask:${{ github.sha }} \
            .

      - name: Run container
        run: |
          docker run -d \
            --name flask-test \
            --network projecta-platform \
            localhost:5001/projecta-flask:${{ github.sha }}

      - name: Wait for application
        run: sleep 5

      - name: Verify application
        run: |
          curl --fail http://flask-test:8000/health

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            localhost:5001/projecta-flask:${{ github.sha }}

      - name: Cleanup container
        if: always()
        run: |
          docker stop flask-test || true
          docker rm flask-test || true

      - name: Push Docker image
        run: |
          docker push localhost:5001/projecta-flask:${{ github.sha }}
