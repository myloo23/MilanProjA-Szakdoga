# nginx a frontend konténerben. Két feladata van: kiszolgálja a buildelt React
# alkalmazást, és továbbítja az /api/ kéréseket a backendnek. Így a böngésző
# mindent ugyanarról a címről kér, nincs szükség CORS-beállításra, és a
# böngészőnek nem kell tudnia, hol fut a backend.
server {
    # A nginx-unprivileged kép nem rootként fut, ezért 1024 alatti portot nem
    # nyithat meg; a 8080 a kép alapértelmezése.
    listen 8080;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # A Kubernetes probe-ok célpontja. Szándékosan nem függ a backendtől.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/notes -> http://backend/notes. A proxy_pass végén lévő "/" miatt
    # az nginx levágja az /api/ előtagot, így a backendnek nem kell tudnia róla.
    # A "backend" a fürtön belüli Service neve, a Kubernetes DNS oldja fel.
    location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A Vite a buildelt fájlok nevébe tartalom-hash-t tesz (index-a1b2c3.js),
    # így ezek sosem változnak: a böngésző nyugodtan tárolhatja őket sokáig.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Minden más útvonal az index.html-t kapja. Az index.html-t viszont nem
    # szabad cache-elni, különben egy új verzió telepítése után a böngésző a
    # régi JS-fájlnevekre hivatkozna.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
