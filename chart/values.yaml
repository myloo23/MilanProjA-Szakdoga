# A chart változó értékei. A templates/ alatti fájlok ezekre hivatkoznak
# ({{ .Values.<kulcs> }}); telepítéskor --set-tel felülírhatók.

# Mindkét saját képet ugyanabból a commitból buildeljük, ezért egy közös tag
# van. A pipeline egyetlen kapcsolóval vált verziót:
#   helm upgrade --install projecta ./chart --set image.tag=<commit-sha>
#
# A registry a képhivatkozás előtagja (<registry>/<repository>:<tag>). A
# mérőgépen ez a gazdagépre publikált registry-port: a k3s ugyanazon a gépen
# fut, és a containerd a loopback-címre mutató registryt kivételként kezeli,
# ezért TLS nélkül is lehúzza róla a képet (a 2.4 pont ezt negatív próbával is
# igazolta: szakdolgozat/bizonyitek/03-platform-koltoztetes.md). Ha a fürt
# valaha külön gépre kerül, ez az előtag nem maradhat `localhost:` — akkor a
# registrynek TLS és hitelesítés kell.
#
# Üresre állítva („--set image.registry=") a chart előtag nélküli nevet
# használ: ez a k3d-s fejlesztéshez való, ahol a kép kézzel kerül a fürtbe.
image:
  registry: localhost:5001
  tag: dev

backend:
  image:
    repository: projecta-flask
  replicaCount: 2

frontend:
  image:
    repository: projecta-frontend
  replicaCount: 2

# Hol éri el a backend (és a migrate init container) az adatbázist.
# A jelszó NEM itt van: a db-credentials Secretből jön, ami a chartban nincs
# benne, hogy a jelszó ne kerüljön gitbe. Egyszeri létrehozása:
#   kubectl create secret generic db-credentials \
#     --from-literal=POSTGRES_USER=projecta \
#     --from-literal=POSTGRES_DB=projecta \
#     --from-literal=POSTGRES_PASSWORD='<jelszó>'
database:
  host: postgres
  port: 5432
  secretName: db-credentials

# A séma-migráció (init container) képe. Ugyanaz, mint a Postgresé, mert abban
# van psql, és a fürtben már megvan.
migrate:
  image: postgres:17-alpine

# A fürtön belüli Postgres. enabled: false esetén a chart nem telepít adatbázist,
# és a database.host egy külső szerverre mutathat.
postgres:
  enabled: true
  image: postgres:17-alpine
  storage: 2Gi

# Böngészőből egy címen érhető el az alkalmazás: minden kérés a frontendhez
# megy, az /api/ kéréseket a frontend nginx-e továbbítja a backendnek.
ingress:
  enabled: true
