name: Request CODEOWNERS reviews
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to process
        required: true
        type: number
permissions:
  contents: read
  pull-requests: write
jobs:
  request-reviews:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Request reviewers from the global CODEOWNERS rule
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          pr_data="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")"
          if [[ "$(jq -r '.draft' <<<"${pr_data}")" == "true" ]]; then
            echo "PR #${PR_NUMBER} is a draft; reviewers will be requested when it is ready."
            exit 0
          fi
          pr_author="$(jq -r '.user.login' <<<"${pr_data}")"
          base_sha="$(jq -r '.base.sha' <<<"${pr_data}")"
          codeowners="$({
            gh api --method GET \
              "repos/${GH_REPO}/contents/.github/CODEOWNERS" \
              -f ref="${base_sha}" \
              --jq '.content' | base64 --decode
          })"
          global_rule="$({
            printf '%s\n' "${codeowners}" |
              awk '
                {
                  sub(/\r$/, "")
                  sub(/[[:space:]]*#.*/, "")
                }
                NF > 1 && $1 == "*" { rule = $0 }
                END { print rule }
              '
          })"
          if [[ -z "${global_rule}" ]]; then
            echo "No global '*' rule found in .github/CODEOWNERS; nothing to request."
            exit 0
          fi
          read -r -a rule_fields <<<"${global_rule}"
          reviewers=()
          team_reviewers=()
          for entry in "${rule_fields[@]:1}"; do
            if [[ ! "${entry}" =~ ^@ ]]; then
              echo "Skipping unsupported CODEOWNERS entry: ${entry}"
              continue
            fi
            owner="${entry#@}"
            if [[ "${owner,,}" == "${pr_author,,}" ]]; then
              echo "Skipping PR author @${owner}."
            elif [[ "${owner}" == */* ]]; then
              team_reviewers+=("${owner#*/}")
            else
              reviewers+=("${owner}")
            fi
          done
          if (( ${#reviewers[@]} == 0 && ${#team_reviewers[@]} == 0 )); then
            echo "No eligible reviewers found."
            exit 0
          fi
          for reviewer in "${reviewers[@]}"; do
            jq -n --arg reviewer "${reviewer}" '{reviewers: [$reviewer]}' |
              gh api --method POST \
                "repos/${GH_REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
                --input - \
                --silent
            echo "Requested review from @${reviewer}."
          done
          for team in "${team_reviewers[@]}"; do
            jq -n --arg team "${team}" '{team_reviewers: [$team]}' |
              gh api --method POST \
                "repos/${GH_REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
                --input - \
                --silent
            echo "Requested review from team @${team}."
          done
